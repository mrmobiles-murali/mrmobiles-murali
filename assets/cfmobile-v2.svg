<svg width="900" height="480" viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      .float { animation: float 4s ease-in-out infinite; transform-origin: center; }
      .glow { animation: glow 2s ease-in-out infinite alternate; }
      .slide { animation: slide 6s linear infinite; }
      @keyframes float { 0%,100% { transform: translateY(0px)} 50% { transform: translateY(-12px)} }
      @keyframes glow { 0% { opacity:0.7 } 100% { opacity:1 } }
      @keyframes slide { 0% { transform: translateX(-10px) } 50% { transform: translateX(10px)} 100% { transform: translateX(-10px)} }
    ]]></style>
  </defs>

  <rect width="900" height="480" rx="24" fill="#071029" />
  <g filter="url(#blur)">
    <circle cx="720" cy="100" r="120" fill="url(#g1)" opacity="0.12" />
    <circle cx="140" cy="360" r="96" fill="#34d399" opacity="0.08"/>
  </g>

  <g class="float">
    <rect x="72" y="56" width="320" height="368" rx="28" fill="#0b1930" stroke="#163341" stroke-width="1.6"/>
    <rect x="110" y="96" width="248" height="22" rx="11" fill="#0ea5e9"/>
    <rect x="110" y="136" width="200" height="14" rx="7" fill="#dbeafe" opacity="0.95"/>
    <rect x="110" y="164" width="176" height="12" rx="6" fill="#dbeafe" opacity="0.6"/>
    <rect x="110" y="198" width="240" height="120" rx="16" fill="url(#g1)" opacity="0.14"/>
    <rect x="150" y="232" width="160" height="12" rx="6" fill="#ffffff" opacity="0.95"/>
    <rect x="150" y="258" width="120" height="12" rx="6" fill="#ffffff" opacity="0.6"/>

    <circle cx="322" cy="290" r="20" fill="#34d399"/>
  </g>

  <g class="slide">
    <rect x="420" y="86" width="420" height="120" rx="18" fill="#071a2b" stroke="#153246"/>
    <rect x="456" y="106" width="332" height="16" rx="8" fill="#e6f6ff"/>

    <rect x="420" y="220" width="420" height="188" rx="20" fill="#071a2b" stroke="#153246"/>
    <rect x="456" y="260" width="220" height="14" rx="7" fill="#0ea5e9"/>
    <rect x="456" y="286" width="280" height="12" rx="6" fill="#dbeafe" opacity="0.9"/>
    <rect x="456" y="312" width="240" height="12" rx="6" fill="#dbeafe" opacity="0.6"/>

    <rect x="520" y="350" width="160" height="18" rx="9" fill="#34d399" opacity="0.95"/>
  </g>

  <text x="72" y="448" fill="#cfe8ff" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700">CFMobile — manage Cloudflare on mobile</text>
</svg>
